site_name: "Oracle Bets"
site_description: "Calibrated League of Legends betting research and reporting."
site_author: "Yureeh"
repo_url: "https://github.com/Yureehh/Oracle-Bets"
repo_name: "Yureehh/Oracle-Bets"
edit_uri: "edit/main/docs/"

theme:
  name: "material"
  palette:
    - scheme: "default"
      primary: "indigo"
      accent: "teal"
  font:
    text: "Roboto"
    code: "Roboto Mono"
  features:
    - "navigation.instant"
    - "navigation.tracking"
    - "navigation.top"
    - "content.code.copy"

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Architecture: architecture.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Data Pipeline: data_pipeline.md
  - Modeling: modeling.md
  - Daily Operations: daily_operations.md
  - Predictions and Markets: predictions_markets.md
  - Evidence and Profit: evidence_profit.md
  - Reports and Notebooks: reports_notebooks.md
  - Security and Hosting: security_hosting.md
  - Testing: testing.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - markdownextradata

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

site_dir: "site"
