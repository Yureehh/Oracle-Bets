site_name: "Oracle Bets"
site_description: "Modular sports and esports prediction suite with Discord delivery."
site_author: "Yureeh"
repo_url: "https://github.com/Yureehh/Oracle-Bets"
repo_name: "Yureehh/Oracle-Bets"
edit_uri: "edit/main/docs/"

theme:
  name: "material"
  palette:
    - scheme: "default"
      primary: "indigo"
      accent: "teal"
  font:
    text: "Roboto"
    code: "Roboto Mono"
  features:
    - "navigation.instant"
    - "navigation.tracking"
    - "navigation.top"
    - "content.code.copy"

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting_started/overview.md
      - Installation: getting_started/installation.md
      - Quickstart: getting_started/quickstart.md
  - Pipeline: pipeline.md
  - Models: models.md
  - Audits:
      - LoL Algorithm Audit: audits/lol_algorithm_audit.md
      - LoL Feature Engineering 2026 Audit: audits/lol_feature_engineering_2026_audit.md
  - Predictions: predictions.md
  - Configuration: configuration.md
  - Next Steps: next_steps.md
  - Contributing: contributing.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - markdownextradata

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

site_dir: "site"
