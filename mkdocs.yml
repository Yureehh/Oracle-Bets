site_name: "Oracle Bets"
site_description: "Calibrated League of Legends betting research and reporting."
site_author: "Yureeh"
repo_url: "https://github.com/Yureehh/Oracle-Bets"
repo_name: "Yureehh/Oracle-Bets"
edit_uri: "edit/main/docs/"

theme:
  name: "material"
  palette:
    - scheme: "default"
      primary: "indigo"
      accent: "teal"
  font:
    text: "Roboto"
    code: "Roboto Mono"
  features:
    - "navigation.instant"
    - "navigation.tracking"
    - "navigation.top"
    - "content.code.copy"

nav:
  - Home: index.md
  - System: system.md
  - Commands: commands.md
  - Pipeline status: pipeline-status.md
  - LoL paper protocol: lol-paper-protocol.md
  - Paper owner checklist: paper-owner-checklist.md
  - Roadmap: roadmap.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - markdownextradata

site_dir: "site"
