[tool.poetry]
name = "lol-oracle"
version = "0.10.3"
description = "League of Legends esports analytics betting suite"
authors = ["Matthew Rittinghouse <matthew.rittinghouse@gmail.com>, Juri Fabbri <yureefabbri@gmail.com>"]
readme = "README.md"
packages = [
    { include = "**/*" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
urllib3= "1.26.16"
awswrangler = "^3.7.1"
boto3 = "^1.34.66"
discord = "^2.3.2"
matplotlib = "3.8.3"
numpy = "^1.26.4"
pandas = "^2.2.1"
python-dotenv = "^1.0.1"
requests = "^2.31.0"
seaborn = "^0.13.2"
trueskill = "^0.4.5"
openskill = "^5.1.1"
tqdm = "^4.66.2"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pre-commit = "^3.7.0"
flake8 = "^7.0.0"
black = {extras = ["jupyter"], version = "^24.4.2"}
isort = "^5.13.2"
optuna = "^3.6.1"
tabulate = "^0.9.0"
glicko2 = {git = "https://github.com/sublee/glicko2.git"}
whole-history-rating = "1.6.2"
tdqm = "^0.0.1"
ipykernel = "^6.29.4"
shap = "^0.45.1"
flake8-bugbear = "^24.4.26"
flake8-comprehensions = "^3.14.0"
pep8-naming = "^0.14.1"
flake8-import-order = "^0.18.2"
flake8-docstrings = "^1.7.0"
commitizen = "^3.27.0"
streamlit = "^1.35.0"
plotly = "^5.22.0"
fastparquet = "^2024.5.0"
lightgbm = "^4.4.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.49"
mkdocs-markdownextradata-plugin = "^0.2.6"
mkdocs-material-extensions = "^1.3.1"
fireducks = "^1.1.5"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
moto = "^4.1.12"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
flake8-docstrings = "^1.7.0"
black = "^24.3.0"
coverage = "^7.4.4"
pylint = "^3.1.0"
isort = "^5.13.0"
build = "^1.1.1"
ipykernel = "^6.29.4"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs|
    \.git|
    \.hg|
    \.mypy_cache|
    \.nox|
    \.tox|
    \.venv|
    _build|
    buck-out|
    build|
    dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8-docstrings]
docstring-convention = "google"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
