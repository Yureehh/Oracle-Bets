[tool.poetry]
name = "leaguepredictor"
version = "0.1.0"
description = "League of Legends esports analytics suite"
authors = ["Matthew Rittinghouse <rittinghousemt@g.cofc.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
awswrangler = "^3.2.1"
boto3 = "^1.28.2"
discord = "^2.3.1"
matplotlib = "^3.7.2"
nest_asyncio = "^1.5.6"
numpy = "^1.25.0"
pandas = "^2.0.3"
python-dotenv = "^1.0.0"
rapidfuzz = "^3.1.1"
requests = "^2.31.0"
scikit_learn = "^1.3.0"
scipy = "^1.9.3"
seaborn ="^0.12.2"
trueskill = "^0.4.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
moto = "^4.1.12"

[tool.poetry.group.dev.dependencies]
flake8 = "^6.0.0"
flake8-docstrings = "^1.7.0"
black = "^23.7.0"
coverage = "^7.2.7"
pylint = "^2.17.4"
isort = "^5.11.2"
build = "^0.10.0"

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8-docstrings]
docstring-convention = "google"