[project]
name = "lol-oracle"
version = "0.10.3"
description = "Esports analytics betting suite"
authors = [{ name = "yureeh", email = "yureefabbri@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
  "awswrangler >=3.7.1,<4.0.0",
  "boto3 >=1.34.66,<2.0.0",
  "discord >=2.3.2,<3.0.0",
  "fastparquet >=2024.5.0,<2025.0.0",
  "glicko2 @ git+https://github.com/sublee/glicko2.git",
  "lightgbm >=4.4.0,<5.0.0",
  "matplotlib ==3.8.3",
  "numpy >=1.26.4,<2.0.0",
  "openskill >=5.1.1,<6.0.0",
  "optuna >=3.6.1,<4.0.0",
  "pandas >=2.2.1,<3.0.0",
  "plotly >=5.22.0,<6.0.0",
  "polars >=1.18.0,<2.0.0",
  "python-dotenv >=1.0.1,<2.0.0",
  "requests >=2.31.0,<3.0.0",
  "seaborn >=0.13.2,<1.0.0",
  "shap >=0.45.1,<1.0.0",
  "streamlit >=1.35.0,<2.0.0",
  "tabulate >=0.9.0",
  "tqdm >=4.66.2,<5.0.0",
  "trueskill >=0.4.5,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "black[jupyter] >=24.4.2,<25.0.0",
  "commitizen >=3.27.0,<4.0.0",
  "coverage >=7.4.4,<8.0.0",
  "ipykernel >=6.29.4,<7.0.0",
  "mkdocs >=1.6.1,<2.0.0",
  "mkdocs-markdownextradata-plugin >=0.2.6,<1.0.0",
  "mkdocs-material >=9.5.49,<10.0.0",
  "mkdocs-material-extensions >=1.3.1,<2.0.0",
  "pre-commit >=4.0.1,<5.0.0",
  "pytest >=7.4.0,<8.0.0",
  "pytest-cov >=4.1.0,<5.0.0",
  "ruff >=0.12.7,<1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
force-exclude = true
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "notebooks",
  "site-packages",
  "venv",
]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",
  "COM",
  "C90",
  "DJ",
  "EXE",
  "T10",
  "TID",
  "DTZ",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D200",
  "D203",
  "D205",
  "D211",
  "D212",
  "D400",
  "D401",
  "D415",
  "E402",
  "EM101",
  "EM102",
  "E501",
  "TRY003",
  "TRY401",
  "TD002",
  "TD003",
  "FIX002",
  "PLR0913",
  "PD901",
  "S101",
  "N803",
  "N806",
  "FBT001",
  "FBT002",
  "FBT003",
  "N999",
  "G004",
  "TRY300",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF046",
  "SLF001",
  "BLE001",
]
dummy-variable-rgx = "^(_+|_[a-zA-Z0-9]+)$"

[tool.ruff.lint.per-file-ignores]
"*/grid_central_data.py" = ["A002", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
