name: CI

on:
  pull_request:
  push:
    branches: [main, dev, big-refactor]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install exact dependencies
        run: uv sync --frozen --extra dev --extra discord-bot
      - name: Lint Python
        run: uv run ruff check packages tests
      - name: Verify Python formatting
        run: uv run ruff format --check packages tests
      - name: Typecheck all Python packages
        run: |
          uv run ty check \
            --extra-search-path packages/oracle-bets-core/src \
            --extra-search-path packages/lol-bets/src \
            --extra-search-path packages/oracle-bets-discord/src \
            packages
      - name: Run deterministic test suite
        run: uv run pytest -q
      - name: Compile packages
        run: uv run python -m compileall -q packages
      - name: Smoke-test optional Discord package
        run: uv run python -c "import discord; import oracle_bets_discord.bot"
      - name: Exercise evidence backup and restore
        run: |
          evidence_dir="$(mktemp -d)"
          uv run oracle-bets evidence init --database "$evidence_dir/evidence.db"
          uv run oracle-bets evidence health --database "$evidence_dir/evidence.db"
          uv run oracle-bets evidence backup \
            --database "$evidence_dir/evidence.db" \
            --output "$evidence_dir/backups"
          uv run oracle-bets evidence restore-verify "$evidence_dir"/backups/*.db
      - name: Exercise CLI health contract
        run: |
          set +e
          uv run oracle-bets lol health
          status=$?
          test "$status" -eq 0 -o "$status" -eq 2

  documentation:
    name: Documentation contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Install exact dependencies
        run: uv sync --frozen --extra dev
      - name: Build strict documentation
        run: uv run mkdocs build --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan committed content
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
