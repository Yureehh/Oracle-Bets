name: CI

on:
  pull_request:
  push:
    branches: [main, dev, big-refactor]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check packages tests
      - name: Test
        run: uv run --extra dev pytest -q
      - name: Compile packages
        run: uv run python -m compileall packages
      - name: CLI health smoke
        run: |
          set +e
          uv run oracle-bets lol health
          status=$?
          test "$status" -eq 0 -o "$status" -eq 2
